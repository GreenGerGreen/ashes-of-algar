const evidence={mother:['Кристалл Патриции','Редкий зелёный кристалл с трещиной. Эл хранит его как память о матери.'],found:['Найденный кристалл','Похож на материнский, но целый. Его происхождение неизвестно.'],echo:['Последнее эхо','Запись спора, крик и тёмный силуэт. Подлинность пока не установлена.'],body:['Исчезнувшее тело','Эл узнал человека из эха в закоулке. При возвращении с Томом тела уже не было.'],remi:['Наблюдение Рэми','Структура кристаллов необычна. Необходима дальнейшая экспертиза.']};
const scenes={
start:{art:'interrogation',loc:'Комитет кристаллов',speaker:'Ирэль Каор',chapter:'Пролог · Допрос',goal:'Объяснить происхождение кристаллов.',line:'Вам знакомы эти предметы, господин Солитен? Один с трещиной. Второй — совершенно целый.',add:['mother','found'],choices:[['Один принадлежал моей матери. Второй я нашёл.','question'],['Почему вы изъяли вещь моей матери?','question']]},
question:{art:'interrogation',loc:'Комитет кристаллов',speaker:'Ирэль Каор',chapter:'Пролог · Допрос',goal:'Рассказать, что произошло.',line:'Владелец второго кристалла пропал. Нам известно, что вы воспроизводили запись. Расскажите всё с самого начала.',choices:[['Рассказать о находке.','flash'],['Я не убивал этого человека.','flash']]},
flash:{art:'bar',loc:'Сытая Хиба · главный зал',speaker:'Эл Солитен',chapter:'Глава I · Воспоминание',goal:'Осмотреть находку.',line:'Поздний вечер. Последние гости разошлись. На одном из столов остался кристалл — удивительно похожий на мамин.',choices:[['Осмотреть кристалл.','crystal'],['Забрать его за стойку.','crystal']]},
crystal:{art:'bar',loc:'Сытая Хиба · главный зал',speaker:'Эл Солитен',chapter:'Глава I · Воспоминание',goal:'Узнать, что хранит кристалл.',line:'Та же огранка. Та же глубина зелёного цвета. Только этот совершенно целый… Может быть, Рэми поймёт, откуда он.',choices:[['Воспроизвести последнее эхо.','echo'],['Сначала записать наблюдение в журнал.','echo']]},
echo:{art:'attic',loc:'Воспоминание · поздний вечер',speaker:'Эл Солитен',chapter:'Глава I · Воспоминание',goal:'Осмыслить запись.',line:'В воздухе возникает изображение. Двое мужчин спорят. Внезапно — тёмный силуэт, крик. Эхо обрывается. Может, это какая-то иллюзия?',add:['echo'],choices:[['Отложить кристалл до утра.','alley']]},
alley:{art:'alley',loc:'Квартал Сытой Хибы · закоулок',speaker:'Эл Солитен',chapter:'Глава I · Воспоминание',goal:'Позвать Тома.',line:'На мостовой лежит человек. Эл узнаёт его — тот самый мужчина из вчерашней записи. Он не отвечает.',add:['body'],choices:[['Бежать за Томом.','gone']]},
gone:{art:'alley',loc:'Квартал Сытой Хибы · закоулок',speaker:'Том Амик',chapter:'Глава I · Воспоминание',goal:'Решить, что делать с находкой.',line:'Эл… здесь никого нет. Ты уверен, что не перепутал место? Может, тебе нужно немного поспать?',choices:[['Я точно его видел.','remi'],['Ладно. Не будем об этом.','remi']]},
remi:{art:'workshop',loc:'Мастерская Рэми',speaker:'Рэми Дюваль',chapter:'Глава I · Воспоминание',goal:'Попросить Рэми исследовать кристаллы.',line:'Они действительно похожи, Эл. Но такую структуру я раньше не видел. Мне нужно время, чтобы разобраться.',add:['remi'],choices:[['Только никому не рассказывай про мамин кристалл.','return']]},

const $=id=>document.getElementById(id);const keys=Object.keys(scenes);let state={scene:'start',clues:[]};let timer;const storage='algar-echo-v01';function read(){try{return JSON.parse(localStorage.getItem(storage))}catch{return null}}function save(){try{localStorage.setItem(storage,JSON.stringify(state));$('saveStatus').textContent='Прогресс сохранён'}catch{$('saveStatus').textContent='Сохранение недоступно'}}function note(s){$('notice').textContent=s;$('notice').classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>$('notice').classList.add('hidden'),1800)}function menu(){$('play').classList.add('hidden');$('menu').classList.remove('hidden');$('continue').disabled=!read()}function go(id){if(id==='menu'){menu();return}const s=scenes[id];if(!s)return;state.scene=id;for(const e of s.add||[])if(!state.clues.includes(e)){state.clues.push(e);note('Журнал обновлён')}save();$('menu').classList.add('hidden');$('play').classList.remove('hidden');$('art').style.backgroundImage='url('+ART[s.art]+')';$('loc').textContent=s.loc;$('speaker').textContent=s.speaker;$('line').textContent=s.line;$('chapter').textContent=s.chapter;$('goal').textContent=s.goal;$('meter').style.width=((keys.indexOf(id)+1)/keys.length*100)+'%';$('clues').textContent=state.clues.slice(-3).map(x=>evidence[x][0]).join(' · ')||'Пока нет';$('choices').replaceChildren();for(const [label,next] of s.choices){const b=document.createElement('button');b.className='choice';b.textContent=label;b.onclick=()=>go(next);$('choices').append(b)}}function modal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('overlay').classList.remove('hidden');$('close').focus()}function close(){$('overlay').classList.add('hidden')}function panel(p){if(p==='journal'){modal('Журнал расследования',state.clues.map(x=>'<div class="entry"><strong>'+evidence[x][0]+'</strong><br>'+evidence[x][1]+'</div>').join('')||'<p>Улик пока нет.</p>')}if(p==='inventory'){modal('Предметы и улики','<p class="sub">В прологе кристаллы находятся у Ирэль. Нажми на предмет для изучения.</p><div class="items">'+state.clues.filter(x=>['mother','found'].includes(x)).map(x=>'<button class="item" data-item="'+x+'"><span class="gem">'+(x==='mother'?'◈':'◆')+'</span>'+evidence[x][0]+'</button>').join('')+'</div>');document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>modal(evidence[b.dataset.item][0],'<p>'+evidence[b.dataset.item][1]+'</p><button id="backItems">Назад</button>')||null);$('modalBody').onclick=e=>{if(e.target.id==='backItems')panel('inventory')}}if(p==='map'){modal('Квартал Алгара','<p class="sub">Предварительный список локаций. В этом прологе переходы сюжетные.</p>'+['Комитет кристаллов','Сытая Хиба','Закоулок','Мастерская Рэми'].map(x=>'<div class="mapnode '+(scenes[state.scene].loc.includes(x)?'active':'')+'">'+x+'</div>').join(''))}if(p==='settings'){modal('Меню','<button id="manual">Сохранить</button> <button id="home">Главное меню</button><p class="sub">Сохранение хранится в этом браузере.</p>');$('manual').onclick=()=>{save();note('Сохранено')};$('home').onclick=()=>{close();menu()}}}
$('menu').style.backgroundImage='url('+ART.alley+')';$('new').onclick=()=>{if(read()&&!confirm('Начать новую игру? Предыдущее сохранение будет заменено.'))return;state={scene:'start',clues:[]};go('start')};$('continue').onclick=()=>{let s=read();if(s&&scenes[s.scene]&&Array.isArray(s.clues)){state=s;go(s.scene)}};$('about').onclick=()=>modal('О прототипе','<p>Версия 0.1: допрос, воспоминание, пять записей журнала, осмотр кристаллов, меню и локальное сохранение. Иллюстрации — фрагменты концепт-артов; финальная графика и полноценные ветвления ещё не реализованы.</p>');document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>panel(b.dataset.panel));$('close').onclick=close;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});menu();
</script></body></html>
